name: Deploy Production

on:
  push:
    branches:
      - ru

permissions:
  contents: read

concurrency:
  group: miobeauty-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Configure SSH
        env:
          REG_SSH_KEY: ${{ secrets.REG_SSH_KEY }}
          REG_KNOWN_HOSTS: ${{ secrets.REG_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$REG_SSH_KEY" > ~/.ssh/regru
          chmod 600 ~/.ssh/regru

          printf '%s\n' "$REG_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to REG.RU
        env:
          REG_HOST: ${{ secrets.REG_HOST }}
          REG_USER: ${{ secrets.REG_USER }}
          REG_DEPLOY_PATH: ${{ secrets.REG_DEPLOY_PATH }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/regru -o IdentitiesOnly=yes" \
            dist/ \
            "$REG_USER@$REG_HOST:$REG_DEPLOY_PATH/"
